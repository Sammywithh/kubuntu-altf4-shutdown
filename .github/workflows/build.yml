name: Build Linux Binary

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --verbose

      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux distribution archive
        run: |
          mkdir -p dist/kubuntu-altf4-shutdown artifacts
          cp target/release/kubuntu-shutdown-dialog dist/kubuntu-altf4-shutdown/
          cp install.sh uninstall.sh test_dialog.sh README.md dist/kubuntu-altf4-shutdown/
          cp -r dbus desktop kwin-script dist/kubuntu-altf4-shutdown/
          chmod 0755 dist/kubuntu-altf4-shutdown/kubuntu-shutdown-dialog \
            dist/kubuntu-altf4-shutdown/install.sh \
            dist/kubuntu-altf4-shutdown/uninstall.sh \
            dist/kubuntu-altf4-shutdown/test_dialog.sh

          tar -C dist -czf artifacts/kubuntu-altf4-shutdown-linux-x86_64.tar.gz kubuntu-altf4-shutdown
          cp target/release/kubuntu-shutdown-dialog artifacts/kubuntu-shutdown-dialog-linux-x86_64
          (
            cd artifacts
            sha256sum kubuntu-altf4-shutdown-linux-x86_64.tar.gz kubuntu-shutdown-dialog-linux-x86_64 > SHA256SUMS.txt
          )

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kubuntu-shutdown-dialog-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: kubuntu-shutdown-dialog-linux-x86_64
          path: artifacts/

      - name: Verify artifact checksums
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/kubuntu-altf4-shutdown-linux-x86_64.tar.gz
            artifacts/kubuntu-shutdown-dialog-linux-x86_64
            artifacts/SHA256SUMS.txt
